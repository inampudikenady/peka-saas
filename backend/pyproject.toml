[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
ignore = ["E701", "E702"]

[tool.ruff.lint.per-file-ignores]
"app/models/__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.13"
plugins = ["sqlalchemy.ext.mypy.plugin"]
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
  "app.services.platform_user_service",
  "app.services.tenant_user_management_service",
  "app.services.tenant_service",
]
ignore_errors = true
