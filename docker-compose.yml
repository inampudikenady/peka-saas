services:
  postgres:
    image: postgres:16
    container_name: peka-saas-postgres
    environment:
      POSTGRES_DB: peka_saas
      POSTGRES_USER: peka
      POSTGRES_PASSWORD: peka
    ports:
      - "5432:5432"
    volumes:
      - peka_saas_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peka -d peka_saas"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://peka:peka@postgres:5432/peka_saas
      DEBUG: "false"
      PLATFORM_ADMIN_JWT_SECRET: ${PLATFORM_ADMIN_JWT_SECRET:-change-me-local-only}
      TENANT_URL_MODE: path
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  peka_saas_postgres_data:
