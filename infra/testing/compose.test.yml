services:
  test-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: peka_saas_test
      POSTGRES_USER: peka_test
      POSTGRES_PASSWORD: peka_test
    ports:
      - "127.0.0.1:${PEKA_TEST_POSTGRES_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peka_test -d peka_saas_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  test-qdrant:
    image: qdrant/qdrant:v1.14.1
    ports:
      - "127.0.0.1:${PEKA_TEST_QDRANT_HTTP_PORT:-56333}:6333"
      - "127.0.0.1:${PEKA_TEST_QDRANT_GRPC_PORT:-56334}:6334"
    tmpfs:
      - /qdrant/storage
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333;
          printf "GET /healthz HTTP/1.0\r\n\r\n" >&3;
          grep -q "200 OK" <&3'
      interval: 2s
      timeout: 3s
      retries: 20
